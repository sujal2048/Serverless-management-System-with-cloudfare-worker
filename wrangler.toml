name = "sujal-newsletter"
main = "src/index.js"
compatibility_date = "2024-12-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["0 */6 * * *"]  # Every 6 hours

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_ID"

[[d1_databases]]
binding = "D1"
database_name = "newsletter_db"
database_id = "REPLACE_WITH_D1_ID"

[vars]
# Basic Configuration
WORKER_VERSION = "1.0.0"
APP_NAME = "Sujal Gupta's Tech Newsletter"
ENVIRONMENT = "production"

# Email Configuration
EMAIL_PROVIDER = "gmail"
EMAIL_FROM_NAME = "Sujal Gupta"
EMAIL_REPLY_TO = "REPLACE_WITH_YOUR_EMAIL"

# RSS Configuration
RSS_FEED_URL = "https://sujal2048.github.io/index.xml"
USER_AGENT = "Sujal-Newsletter-Bot/1.0"
FETCH_TIMEOUT_MS = 30000

# Rate Limiting
GMAIL_DAILY_LIMIT = 490
GMAIL_PER_MINUTE_LIMIT = 20
BATCH_SIZE = 95
BATCH_WAIT_MINUTES = 3
MAX_POSTS_PER_RUN = 1

# Site Configuration
SITE_URL = "https://sujal2048.github.io"
SITE_OWNER = "Sujal Gupta"
GITHUB_REPO_URL = "https://github.com/sujal2048/sujal2048.github.io"

# Paths
SUBSCRIBE_WEB_PATH = "/subscribe"
SUBSCRIBE_API_PATH = "/api/subscribe"
UNSUBSCRIBE_WEB_PATH = "/unsubscribe"
UNSUBSCRIBE_API_PATH = "/api/unsubscribe"
CONTACT_WEB_PATH = "/contact"
CONTACT_API_PATH = "/api/contact"
STATUS_PATH = "/status"

# Turnstile Configuration
TURNSTILE_API_URL = "https://challenges.cloudflare.com/turnstile/v0/api.js"
TURNSTILE_VERIFY_URL = "https://challenges.cloudflare.com/turnstile/v0/siteverify"
TURNSTILE_THEME = "dark"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# Rate Limiters
[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "FORM_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }
