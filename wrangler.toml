name = "sujal-newsletter"
main = "src/index.js"
compatibility_date = "2024-12-31"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["0 */6 * * *"]  # Every 6 hours

[[kv_namespaces]]
binding = "KV"
id = "d57c436ef91f4a28a958c571cd671247"
preview_id = "d57c436ef91f4a28a958c571cd671247"

[[d1_databases]]
binding = "newsletter_db"
database_name = "newsletter_db"
database_id = "7ad1c66a-9be1-4db7-a1de-1bfd24130ea6"

[vars]
# Basic Configuration
WORKER_VERSION = "2.0.0"


# Email Configuration
EMAIL_PROVIDER = "gmail"
EMAIL_FROM_NAME = "Sujal's Newletter"
EMAIL_REPLY_TO = "sujalgupta280103@gmail.com"

# Gmail SMTP Configuration
GMAIL_HOST = "smtp.gmail.com"
GMAIL_PORT = 587

# RSS Configuration
RSS_FEED_URL = "https://sujal2048.github.io/index.xml"
USER_AGENT = "Sujal-Newsletter-Bot/2.0"
FETCH_TIMEOUT_MS = 60000

# Gmail Rate Limiting Configuration
# Gmail has a daily limit of 500 emails for regular accounts, 2000 for Google Workspace
# We'll use 490 to leave some buffer for manual emails
# Rate Limiting
GMAIL_DAILY_LIMIT = 490
GMAIL_PER_MINUTE_LIMIT = 20

# Batching and Pacing (optimized for Gmail limits)
# Gmail allows up to 100 BCC recipients, but we use 95 to be safe
# With 95 recipients per email, we can send to 4655 recipients with 49 emails
# To stay under 490 daily limit, we batch carefully
BATCH_SIZE = 95
BATCH_WAIT_MINUTES = 3
MAX_POSTS_PER_RUN = 1



# GitHub backup removed - Data is permanently stored in D1 database

# Cron Configuration
WEEKLY_CRON = "0 0 * * sat"

# KV Storage Prefixes
PREFIX_SUBSCRIBER = "subscriber"
PREFIX_EMAIL_QUEUE = "email-queue"
PREFIX_NEWSLETTER_SENT = "newsletter-sent"
PREFIX_NEWSLETTER_SENT_URL = "newsletter-sent-url"
PREFIX_CONTACT = "contact"
PREFIX_CAPTCHA = "captcha"
PREFIX_BOT = "bot"
PREFIX_BOT_DETECT = "bot-detect"
PREFIX_BACKUP_CHUNK = "backup-chunk"

# Cleanup Configuration - Additional prefixes to keep during maintenance
KEEP_PREFIX_MAINTENANCE = "maintenance:last-"
KEEP_PREFIX_DAILY = "daily:last-"
KEEP_PREFIX_DEPLOYMENT = "deployment:"
KEEP_PREFIX_STATS = "stats:"

# Protection Settings (Rate limiting is handled by native Cloudflare rate limiters below)
ABUSE_THRESHOLD = 3  # Number of rate limit hits before showing Turnstile
SUSPICIOUS_ACTIVITY_THRESHOLD = 5  # Suspicious attempts before Turnstile
STATUS_PAGE_PROTECTION = true  # Require Turnstile for status page

# TTL (Time To Live) Configuration in seconds - for auto-expiring temporary entries
TTL_BOT_DETECT = 86400  # 24 hours - Bot detection entries auto-expire
TTL_SUSPICIOUS_ACTIVITY = 3600  # 1 hour - Suspicious activity counters auto-expire
TTL_ABUSE_COUNTER = 3600  # 1 hour - Abuse counters auto-expire
TTL_DAILY_STATS = 172800  # 2 days - Daily statistics auto-expire
TTL_ERROR_LOGS = 604800  # 7 days - Error logs auto-expire
TTL_FEED_ERROR = 86400  # 24 hours - Feed fetch errors auto-expire
TTL_BACKUP_CHUNK = 604800  # 7 days - Backup chunks auto-expire


# Backup Processing Configuration
BACKUP_CHUNK_SIZE = 20  # Records to process at a time
BACKUP_CHUNK_LIST_LIMIT = 1000  # Max chunks to list when merging
CLEANUP_BATCH_SIZE = 100  # Keys to delete per batch in cleanup

# Site Configuration
SITE_URL = "https://sujal2048.github.io"
UNSUBSCRIBE_URL = "https://sujal2048.github.io/unsubscribe-newsletter/"
SITE_OWNER = "Sujal Gupta"
GITHUB_REPO_URL = "https://github.com/sujal2048/sujal2048.github.io"

# Paths
SUBSCRIBE_WEB_PATH = "/subscribe"
SUBSCRIBE_API_PATH = "/api/subscribe"
UNSUBSCRIBE_WEB_PATH = "/unsubscribe"
UNSUBSCRIBE_API_PATH = "/api/unsubscribe"
CONTACT_WEB_PATH = "/contact"
CONTACT_API_PATH = "/api/contact"
STATUS_PATH = "/status"

# Turnstile Configuration
TURNSTILE_API_URL = "https://challenges.cloudflare.com/turnstile/v0/api.js"
TURNSTILE_VERIFY_URL = "https://challenges.cloudflare.com/turnstile/v0/siteverify"
TURNSTILE_THEME = "dark"

# Retry Configuration
RETRY_INITIAL_DELAY = 1000  # Initial delay in milliseconds
RETRY_MAX_DELAY = 30000  # Maximum delay in milliseconds
RETRY_BACKOFF_MULTIPLIER = 2  # Exponential backoff multiplier
RETRY_MAX_ATTEMPTS = 3  # Maximum retry attempts
CIRCUIT_BREAKER_RESET_TIMEOUT = 60000  # Circuit breaker reset timeout in milliseconds

# Timeout Configuration
GMAIL_TIMEOUT_MS = 30000  # Gmail SMTP timeout in milliseconds
CACHE_CONTROL_MAX_AGE = 3600  # Cache-Control max-age in seconds
CORS_MAX_AGE = 86400  # CORS max-age in seconds
COOKIE_TTL = 3600  # Cookie TTL in seconds
STATUS_PAGE_COOKIE_TTL = 300  # Status page verification cookie TTL in seconds (5 minutes)


[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# Rate Limiters
# Global rate limiting - First check for all requests
[[ratelimits]]
name = "GLOBAL_RATE_LIMITER"
namespace_id = "1001"
# 20 requests per minute per IP (stricter to prevent abuse)
simple = { limit = 20, period = 60 }

# Form submission rate limiting (subscribe, unsubscribe, contact)
[[ratelimits]]
name = "FORM_RATE_LIMITER"
namespace_id = "1002"
# 2 requests per minute (balanced: prevents spam while allowing legitimate use)
# This means max 120 form submissions per hour theoretically, realistically 10-20
simple = { limit = 2, period = 60 }

# Admin API rate limiting
[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1003"
# 2 requests per minute (balanced admin protection)
simple = { limit = 2, period = 60 }


# Aggressive bot protection - for detected bots/suspicious activity
[[ratelimits]]
name = "BOT_RATE_LIMITER"
namespace_id = "1004"
# EXTREMELY strict: 1 request per minute for suspected bots
simple = { limit = 1, period = 60 }

# Newsletter check rate limiting - for admin check-now endpoint
[[ratelimits]]
name = "NEWSLETTER_CHECK_LIMITER"
namespace_id = "1005"
# 2 checks per minute (prevent abuse while allowing testing)
simple = { limit = 2, period = 60 }

# Additional rate limiters for comprehensive protection

# API endpoint rate limiting - for all /api/* endpoints
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1006"
# 3 requests per minute for API endpoints (strict to prevent API abuse)
simple = { limit = 3, period = 60 }

# Burst protection - very short window
[[ratelimits]]
name = "BURST_RATE_LIMITER"
namespace_id = "1011"
# 5 requests per 10 seconds (strict burst protection against automated attacks)
simple = { limit = 5, period = 10 }

